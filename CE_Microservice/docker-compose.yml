

services:
  #
  # Mule Worker 1 - Load balanced via APISIX
  #
  ce-base-mule-backend-1:
    build: docker_mulesoft
    image: 92455890/ce-base-mule-server:${versionMule}
    environment:
      mule_env: ${mule_env}
      muleVersion: ${muleVersion}
      MULEAPP_GROUP_ID: ${MULEAPP_GROUP_ID}
      MULEAPP_ARTIFACT_ID: ${MULEAPP_ARTIFACT_ID}
      MULEAPP_VERSION: ${MULEAPP_VERSION}
      ATINA_REPOSITORY_PROTOCOL: ${ATINA_REPOSITORY_PROTOCOL}
      ATINA_REPOSITORY_URL: ${ATINA_REPOSITORY_URL}
      WORKER_ID: worker-1
      # Logstash Authentication
      LOGSTASH_AUTH_TOKEN: ${LOGSTASH_AUTH_TOKEN}
      # Elastic APM Configuration (environment variables)
      ELASTIC_APM_SERVER_URLS: http://apisix:9080/apm-server
      ELASTIC_APM_SECRET_TOKEN: ${APM_SECRET_TOKEN}
      ELASTIC_APM_SERVICE_NAME: ce-mule-base-worker-1
      ELASTIC_APM_SERVICE_VERSION: ${MULEAPP_VERSION}
      ELASTIC_APM_ENVIRONMENT: ${mule_env}
      ELASTIC_APM_LOG_LEVEL: DEBUG
      ELASTIC_APM_TRANSACTION_SAMPLE_RATE: "1.0"
      ELASTIC_APM_APPLICATION_PACKAGES: com.acqua
      ELASTIC_APM_ENABLE_DISTRIBUTED_TRACING: "true"
      # Java agent
      JAVA_OPTS: >-
        -M-javaagent:/opt/mule/mule-standalone-${muleVersion}/lib/user/elastic-apm-agent.jar
        -M-Dmule.worker.id=worker-1
    container_name: ce-base-mule-backend-1
    # Ports removed - access via APISIX gateway at /api/*
    # Direct access for debugging: http://ce-base-mule-backend-1:8081
    expose:
      - "8081"
      - "8082"
    volumes:
     - CEBackendHome:${FOLDER_ROOT}
     - CEBackendActiveMQConf:/opt/activemq/conf
     - CEBackendActiveMQData:/opt/activemq/data
     - CEBackendMuleLog1:/opt/mule/mule-standalone-${muleVersion}/logs
     - CEBackendMuleApps1:/opt/mule/mule-standalone-${muleVersion}/apps
    user: root
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.2
      ce-base-network:
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'DEPLOYED' /opt/mule/mule-standalone-${muleVersion}/logs/mule.log || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 50
      start_period: 480s

  #
  # Mule Worker 2 - Load balanced via APISIX
  #
  ce-base-mule-backend-2:
    build: docker_mulesoft
    image: 92455890/ce-base-mule-server:${versionMule}
    environment:
      mule_env: ${mule_env}
      muleVersion: ${muleVersion}
      MULEAPP_GROUP_ID: ${MULEAPP_GROUP_ID}
      MULEAPP_ARTIFACT_ID: ${MULEAPP_ARTIFACT_ID}
      MULEAPP_VERSION: ${MULEAPP_VERSION}
      ATINA_REPOSITORY_PROTOCOL: ${ATINA_REPOSITORY_PROTOCOL}
      ATINA_REPOSITORY_URL: ${ATINA_REPOSITORY_URL}
      WORKER_ID: worker-2
      # Logstash Authentication
      LOGSTASH_AUTH_TOKEN: ${LOGSTASH_AUTH_TOKEN}
      # Elastic APM Configuration (environment variables)
      ELASTIC_APM_SERVER_URLS: http://apisix:9080/apm-server
      ELASTIC_APM_SECRET_TOKEN: ${APM_SECRET_TOKEN}
      ELASTIC_APM_SERVICE_NAME: ce-mule-base-worker-2
      ELASTIC_APM_SERVICE_VERSION: ${MULEAPP_VERSION}
      ELASTIC_APM_ENVIRONMENT: ${mule_env}
      ELASTIC_APM_LOG_LEVEL: DEBUG
      ELASTIC_APM_TRANSACTION_SAMPLE_RATE: "1.0"
      ELASTIC_APM_APPLICATION_PACKAGES: com.acqua
      ELASTIC_APM_ENABLE_DISTRIBUTED_TRACING: "true"
      # Java agent
      JAVA_OPTS: >-
        -M-javaagent:/opt/mule/mule-standalone-${muleVersion}/lib/user/elastic-apm-agent.jar
        -M-Dmule.worker.id=worker-2
    container_name: ce-base-mule-backend-2
    # Ports removed - access via APISIX gateway at /api/*
    # Direct access for debugging: http://ce-base-mule-backend-2:8081
    expose:
      - "8081"
      - "8082"
    volumes:
     - CEBackendHome:${FOLDER_ROOT}
     - CEBackendActiveMQConf:/opt/activemq/conf
     - CEBackendActiveMQData:/opt/activemq/data
     - CEBackendMuleLog2:/opt/mule/mule-standalone-${muleVersion}/logs
     - CEBackendMuleApps2:/opt/mule/mule-standalone-${muleVersion}/apps
    user: root
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.30
      ce-base-network:
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'DEPLOYED' /opt/mule/mule-standalone-${muleVersion}/logs/mule.log || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 50
      start_period: 480s
      
  ce-base-apachemq-backend:
    build: docker-apache
    image: 92455890/ce-base-apachemq-backend:${versionApacheMQ}
    container_name: ce-base-apachemq-backend
    ports:
     - "${MULE_MQ_WEB_CONSOL_PORT}:8161"
     - "${MULE_MQ_AMQP_PORT}:5672"
     - "${MULE_MQ_OPENWIRE_PORT}:61616"
    volumes:
     - CEBackendActiveMQConf:/opt/activemq/conf
     - CEBackendActiveMQData:/opt/activemq/data
    user: root
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.5
      ce-base-network:
    restart: always
      
  ce-base-maven-backend:
    build: docker_maven
    image: 92455890/ce-base-maven-backend-server:${versionMaven}
    environment:
      MULEAPP_GROUP_ID: ${MULEAPP_GROUP_ID}
      MULEAPP_ARTIFACT_ID: ${MULEAPP_ARTIFACT_ID}
      MULEAPP_VERSION: ${MULEAPP_VERSION}
      ATINA_REPOSITORY_PROTOCOL: ${ATINA_REPOSITORY_PROTOCOL}
      ATINA_REPOSITORY_URL: ${ATINA_REPOSITORY_URL}
    container_name: ce-base-maven-backend
    volumes:
     - CEBackendMuleApps1:/home/apps/worker1
     - CEBackendMuleApps2:/home/apps/worker2
     - CEBackendMavenRepository:/home/repository
    user: root
    depends_on:
      ce-base-mule-backend-1:
        condition: service_healthy
      ce-base-mule-backend-2:
        condition: service_healthy
    restart: "no"
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.4
      ce-base-network:      
      
  ce-base-status-viewer:
    build: docker-status-viewer
    image: 92455890/ce-base-status-viewer-backend-server:${versionStatusViewer}
    environment:
      API_STATUS_URL: ${API_STATUS_URL}
    container_name: ce-base-status-viewer-backend
    user: root
    depends_on:
      ce-base-mule-backend-1:
        condition: service_healthy
      ce-base-mule-backend-2:
        condition: service_healthy
    restart: "no"
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.6
      ce-base-network:         

  ce-base-db-backend: 
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    container_name: ce-base-db-backend
    ports:
     - "${MYSQL_EXTERNAL_PORT}:${MYSQL_INTERNAL_PORT}"
    volumes:
     - CEBackendDBBackendConfig:${MYSQL_FILE_CONFIG}
     - CEBackendDBBackendData:${MYSQL_DATA}
    user: root
    networks:
      ce-base-micronet:
        ipv4_address: 172.42.0.3
      ce-base-network:
    restart: always
               
volumes:
  CEBackendHome: 
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${Volume_CE_base_BackendHome}
  CEBackendActiveMQConf: 
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${Volume_CE_base_BackendActiveMQConf}
  CEBackendActiveMQData: 
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${Volume_CE_base_BackendActiveMQData}
  CEBackendMuleLog1:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${Volume_CE_base_BackendMuleLog1}
  CEBackendMuleLog2:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${Volume_CE_base_BackendMuleLog2}
  CEBackendMuleApps1:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${Volume_CE_base_BackendMuleApps1}
  CEBackendMuleApps2:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${Volume_CE_base_BackendMuleApps2}      
  CEBackendDBBackendConfig: 
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${Volume_CE_base_BackendDBBackendConfig}
  CEBackendDBBackendData: 
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${Volume_CE_base_BackendDBBackendData}      
  CEBackendMavenRepository: 
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${Volume_CE_base_BackendMavenRepository}      
      
networks:
  ce-base-micronet:
    external: true
  ce-base-network:
    external: true       